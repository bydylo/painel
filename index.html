<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel IPTV</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #d8dee4;
      --text: #1f2328;
      --muted: #59636e;
      --primary: #0969da;
      --primary-hover: #0550ae;
      --danger: #cf222e;
      --danger-hover: #a40e26;
      --success: #1a7f37;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      line-height: 1.4;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.45rem;
    }

    .status {
      position: sticky;
      top: 8px;
      z-index: 100;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #ddf4ff; border: 1px solid #54aeff; color: #0550ae; }
    .status.success { background: #dafbe1; border: 1px solid #4ac26b; color: #116329; }
    .status.error { background: #ffebe9; border: 1px solid #ff8182; color: #a40e26; }

    .inline-msg {
      margin-top: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }
    .inline-msg.show { display: block; }
    .inline-msg.info { color: #0550ae; }
    .inline-msg.success { color: #116329; }
    .inline-msg.error { color: #a40e26; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="datetime-local"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text);
      background: #fff;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f6f8fa;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #eaeef2; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }

    .btn-small {
      padding: 5px 8px;
      font-size: 0.8rem;
    }

    .table-wrapper {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f6f8fa;
      font-size: 0.85rem;
      color: var(--muted);
    }

    tr.alterado { background: #fff8c5; }

    .expira-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .expira-atalhos {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge.ativo { background: #dafbe1; color: var(--success); }
    .badge.expirado { background: #ffebe9; color: var(--danger); }
    .badge.ilimitado { background: #ddf4ff; color: var(--primary); }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Painel de Usuários IPTV</h1>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <form id="formConfig" class="card" novalidate>
      <h2>Conexão com o GitHub</h2>
      <div class="grid">
        <label>
          Repositório (usuario/repo)
          <input type="text" id="cfgRepo" value="bydylo/painel" />
        </label>
        <label>
          Branch
          <input type="text" id="cfgBranch" value="main" />
        </label>
        <label>
          Arquivo JSON
          <input type="text" id="cfgArquivo" value="usuarios.json" />
        </label>
        <label>
          Token (PAT com permissão Contents)
          <input type="password" id="cfgToken" placeholder="Cole seu github_pat_ ou ghp_..." />
        </label>
        <div class="actions">
          <button type="submit" id="btnConectar" class="btn-primary">Conectar / Recarregar</button>
          <button type="button" id="btnSair">Limpar Token</button>
        </div>
      </div>
    </form>

    <form id="formNovo" class="card" novalidate>
      <h2>Adicionar Novo Usuário</h2>
      <div class="grid">
        <label>
          Usuário
          <input type="text" id="novoUser" autocomplete="off" />
        </label>
        <label>
          Senha
          <input type="text" id="novaSenha" autocomplete="off" />
        </label>
        <label>
          Validade (em horas, 0 ou vazio = ilimitado)
          <input type="number" id="novaValidade" value="0" min="0" inputmode="numeric" />
        </label>
        <div>
          <button type="submit" id="btnAdicionar" class="btn-primary">Adicionar Usuário</button>
        </div>
      </div>
      <div id="msgNovo" class="inline-msg" aria-live="polite"></div>
    </form>

    <div class="table-wrapper">
      <table id="tabela">
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Senha</th>
            <th>Expiração</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="usuariosBody">
          <tr class="empty-row">
            <td colspan="4">Cole o token acima ou clique em "Conectar / Recarregar".</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "painel_iptv_cfg";

    let usuarios = {};
    let ultimoSha = null;
    let emOperacao = false;

    const elStatus = document.getElementById("status");
    const elMsgNovo = document.getElementById("msgNovo");
    const elBody = document.getElementById("usuariosBody");
    const elFormConfig = document.getElementById("formConfig");
    const elFormNovo = document.getElementById("formNovo");
    const elBtnConectar = document.getElementById("btnConectar");
    const elBtnAdicionar = document.getElementById("btnAdicionar");
    const elBtnSair = document.getElementById("btnSair");

    const elRepo = document.getElementById("cfgRepo");
    const elBranch = document.getElementById("cfgBranch");
    const elArquivo = document.getElementById("cfgArquivo");
    const elToken = document.getElementById("cfgToken");

    function mostrarStatus(mensagem, tipo = "info") {
      elStatus.textContent = mensagem;
      elStatus.className = "status show " + tipo;
    }

    function mostrarMsgNovo(mensagem, tipo = "info") {
      elMsgNovo.textContent = mensagem;
      elMsgNovo.className = "inline-msg show " + tipo;
    }

    window.addEventListener("error", (ev) => {
      mostrarStatus("Erro no navegador: " + ev.message, "error");
    });

    window.addEventListener("unhandledrejection", (ev) => {
      const detalhe = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason);
      mostrarStatus("Erro inesperado: " + detalhe, "error");
    });

    function definirBloqueio(bloqueado, textoBotao = "Conectar / Recarregar") {
      emOperacao = bloqueado;
      document.querySelectorAll("button").forEach((btn) => {
        btn.disabled = bloqueado;
      });
      elBtnConectar.textContent = bloqueado ? textoBotao : "Conectar / Recarregar";
      elBtnAdicionar.textContent = bloqueado ? "Aguarde..." : "Adicionar Usuário";
    }

    function obterConfig() {
      return {
        repo: elRepo.value.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\/+$/, ""),
        branch: elBranch.value.trim() || "main",
        arquivo: elArquivo.value.trim().replace(/^\/+/, ""),
        token: elToken.value.trim()
      };
    }

    function salvarConfigSessao() {
      try {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(obterConfig()));
      } catch (e) {}
    }

    function restaurarConfigSessao() {
      try {
        const salvo = sessionStorage.getItem(STORAGE_KEY);
        if (!salvo) return false;
        const cfg = JSON.parse(salvo);
        if (cfg.repo) elRepo.value = cfg.repo;
        if (cfg.branch) elBranch.value = cfg.branch;
        if (cfg.arquivo) elArquivo.value = cfg.arquivo;
        if (cfg.token) elToken.value = cfg.token;
        return Boolean(cfg.repo && cfg.arquivo && cfg.token);
      } catch (e) {
        return false;
      }
    }

    function base64ParaUtf8(b64) {
      const limpo = b64.replace(/\s/g, "");
