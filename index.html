HTML
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel IPTV</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #d8dee4;
      --text: #1f2328;
      --muted: #59636e;
      --primary: #0969da;
      --primary-hover: #0550ae;
      --danger: #cf222e;
      --danger-hover: #a40e26;
      --success: #1a7f37;
      --warn: #9a6700;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.4;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="datetime-local"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text);
      background: #fff;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f6f8fa;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #eaeef2; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }

    .btn-small {
      padding: 5px 8px;
      font-size: 0.8rem;
    }

    .status {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #ddf4ff; border: 1px solid #54aeff; color: #0550ae; }
    .status.success { background: #dafbe1; border: 1px solid #4ac26b; color: #116329; }
    .status.error { background: #ffebe9; border: 1px solid #ff8182; color: #a40e26; }

    .table-wrapper {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f6f8fa;
      font-size: 0.85rem;
      color: var(--muted);
    }

    tr.alterado {
      background: #fff8c5;
    }

    .expira-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .expira-atalhos {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge.ativo { background: #dafbe1; color: var(--success); }
    .badge.expirado { background: #ffebe9; color: var(--danger); }
    .badge.ilimitado { background: #ddf4ff; color: var(--primary); }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Painel de Usuários IPTV</h1>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <form id="formConfig" class="card">
      <h2>Conexão com o GitHub</h2>
      <div class="grid">
        <label>
          Repositório (usuario/repo)
          <input type="text" id="cfgRepo" value="bydylo/painel" required />
        </label>
        <label>
          Arquivo JSON
          <input type="text" id="cfgArquivo" value="usuarios.json" required />
        </label>
        <label>
          Token (PAT com permissão Contents)
          <input type="password" id="cfgToken" placeholder="github_pat_..." required />
        </label>
        <div class="actions">
          <button type="submit" class="btn-primary">Conectar / Recarregar</button>
          <button type="button" id="btnSair">Limpar Token</button>
        </div>
      </div>
    </form>

    <form id="formNovo" class="card">
      <h2>Adicionar Novo Usuário</h2>
      <div class="grid">
        <label>
          Usuário
          <input type="text" id="novoUser" required autocomplete="off" />
        </label>
        <label>
          Senha
          <input type="text" id="novaSenha" required autocomplete="off" />
        </label>
        <label>
          Validade (em horas, 0 = ilimitado)
          <input type="number" id="novaValidade" value="0" min="0" step="1" required />
        </label>
        <div>
          <button type="submit" class="btn-primary">Adicionar Usuário</button>
        </div>
      </div>
    </form>

    <div class="table-wrapper">
      <table id="tabela">
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Senha</th>
            <th>Expiração</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="usuariosBody">
          <tr class="empty-row">
            <td colspan="4">Informe o repositório e o token acima para carregar os usuários.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "painel_iptv_cfg";

    let usuarios = {};
    let ultimoSha = null;
    let emOperacao = false;

    const elStatus = document.getElementById("status");
    const elBody = document.getElementById("usuariosBody");
    const elFormConfig = document.getElementById("formConfig");
    const elFormNovo = document.getElementById("formNovo");
    const elBtnSair = document.getElementById("btnSair");

    const elRepo = document.getElementById("cfgRepo");
    const elArquivo = document.getElementById("cfgArquivo");
    const elToken = document.getElementById("cfgToken");

    function mostrarStatus(mensagem, tipo = "info") {
      elStatus.textContent = mensagem;
      elStatus.className = `status show ${tipo}`;
    }

    function definirBloqueio(bloqueado) {
      emOperacao = bloqueado;
      document.querySelectorAll("button").forEach((btn) => {
        btn.disabled = bloqueado;
      });
    }

    function obterConfig() {
      return {
        repo: elRepo.value.trim(),
        arquivo: elArquivo.value.trim().replace(/^\/+/, ""),
        token: elToken.value.trim()
      };
    }

    function salvarConfigSessao() {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(obterConfig()));
    }

    function restaurarConfigSessao() {
      const salvo = sessionStorage.getItem(STORAGE_KEY);
      if (!salvo) return false;
      try {
        const cfg = JSON.parse(salvo);
        if (cfg.repo) elRepo.value = cfg.repo;
        if (cfg.arquivo) elArquivo.value = cfg.arquivo;
        if (cfg.token) elToken.value = cfg.token;
        return Boolean(cfg.repo && cfg.arquivo && cfg.token);
      } catch {
        return false;
      }
    }

    function base64ParaUtf8(b64) {
      const limpo = b64.replace(/\s/g, "");
      const binario = atob(limpo);
      const bytes = Uint8Array.from(binario, (ch) => ch.codePointAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function utf8ParaBase64(texto) {
      const bytes = new TextEncoder().encode(texto);
      let binario = "";
      for (const byte of bytes) {
        binario += String.fromCodePoint(byte);
      }
      return btoa(binario);
    }

    function unixParaInputLocal(segundos) {
      if (!segundos || segundos <= 0) return "";
      const d = new Date(segundos * 1000);
      if (Number.isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function inputLocalParaUnix(valor) {
      if (!valor) return 0;
      const ms = new Date(valor).getTime();
      return Number.isNaN(ms) ? 0 : Math.floor(ms / 1000);
    }

    function criarBadgeExpiracao(expira) {
      const span = document.createElement("span");
      const agora = Math.floor(Date.now() / 1000);

      if (!expira || expira <= 0) {
        span.className = "badge ilimitado";
        span.textContent = "Ilimitado";
      } else if (expira < agora) {
        span.className = "badge expirado";
        span.textContent = "Expirado";
      } else {
        span.className = "badge ativo";
        span.textContent = `Ativo até ${new Date(expira * 1000).toLocaleString("pt-BR")}`;
      }
      return span;
    }

    async function carregarUsuarios() {
      const { repo, arquivo, token } = obterConfig();
      if (!repo || !arquivo || !token) {
        mostrarStatus("Preencha repositório, arquivo e token para continuar.", "error");
        return;
      }

      definirBloqueio(true);
      mostrarStatus("Carregando usuários via GitHub API...", "info");

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${arquivo}`, {
          cache: "no-store",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json"
          }
        });

        if (res.status === 404) {
          usuarios = {};
          ultimoSha = null;
          renderizarTabela();
          mostrarStatus(`Arquivo "${arquivo}" não encontrado. Ele será criado no primeiro cadastro.`, "info");
          return;
        }

        if (!res.ok) {
          const erro = await res.json().catch(() => ({}));
          throw new Error(erro.message || `Erro HTTP ${res.status}`);
        }

        const json = await res.json();
        const texto = base64ParaUtf8(json.content || "");
        const dados = texto.trim() ? JSON.parse(texto) : {};

        if (!dados || typeof dados !== "object" || Array.isArray(dados)) {
          throw new Error("O arquivo usuarios.json não contém um objeto JSON válido.");
        }

        usuarios = dados;
        ultimoSha = json.sha;
        salvarConfigSessao();
        renderizarTabela();
        mostrarStatus(`Carregado com sucesso (${Object.keys(usuarios).length} usuário(s)).`, "success");
      } catch (err) {
        mostrarStatus(`Falha ao carregar: ${err.message}`, "error");
      } finally {
        definirBloqueio(false);
      }
    }

    async function persistirUsuarios(novoEstado, mensagemCommit) {
      const { repo, arquivo, token } = obterConfig();
      if (!repo || !arquivo || !token) {
        mostrarStatus("Configure o repositório e o token antes de salvar.", "error");
        return false;
      }

      definirBloqueio(true);
      mostrarStatus("Salvando alterações no GitHub...", "info");

      try {
        const conteudo = JSON.stringify(novoEstado, null, 2) + "\n";
        const payload = {
          message: mensagemCommit,
          content: utf8ParaBase64(conteudo)
        };
        if (ultimoSha) {
          payload.sha = ultimoSha;
        }

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${arquivo}`, {
          method: "PUT",
          cache: "no-store",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (res.status === 409) {
          mostrarStatus("Conflito de versão: o arquivo foi alterado fora desta aba. Recarregando...", "error");
          await carregarUsuarios();
          return false;
        }

        if (!res.ok) {
          const erro = await res.json().catch(() => ({}));
          throw new Error(erro.message || `Erro HTTP ${res.status}`);
        }

        const json = await res.json();
        ultimoSha = json.content?.sha || ultimoSha;
        usuarios = novoEstado;
        renderizarTabela();
        mostrarStatus("Alterações salvas com sucesso no GitHub.", "success");
        return true;
      } catch (err) {
        mostrarStatus(`Erro ao salvar: ${err.message}`, "error");
        renderizarTabela();
        return false;
      } finally {
        definirBloqueio(false);
      }
    }

    function clonarUsuarios() {
      return JSON.parse(JSON.stringify(usuarios));
    }

    function renderizarTabela() {
      elBody.replaceChildren();
      const entradas = Object.entries(usuarios);

      if (entradas.length === 0) {
        const tr = document.createElement("tr");
        tr.className = "empty-row";
        const td = document.createElement("td");
        td.colSpan = 4;
        td.textContent = "Nenhum usuário cadastrado.";
        tr.appendChild(td);
        elBody.appendChild(tr);
        return;
      }

      entradas.forEach(([userOriginal, dados]) => {
        const tr = document.createElement("tr");
        const expiraInicial = Number.isFinite(Number(dados?.expira)) ? Number(dados.expira) : 0;

        // Coluna Usuário
        const tdUser = document.createElement("td");
        const inputUser = document.createElement("input");
        inputUser.type = "text";
        inputUser.value = userOriginal;
        tdUser.appendChild(inputUser);

        // Coluna Senha
        const tdSenha = document.createElement("td");
        const inputSenha = document.createElement("input");
        inputSenha.type = "text";
        inputSenha.value = dados?.senha ?? "";
        tdSenha.appendChild(inputSenha);

        // Coluna Expiração
        const tdExpira = document.createElement("td");
        const expiraWrap = document.createElement("div");
        expiraWrap.className = "expira-cell";

        const inputData = document.createElement("input");
        inputData.type = "datetime-local";
        inputData.value = unixParaInputLocal(expiraInicial);

        const atalhos = document.createElement("div");
        atalhos.className = "expira-atalhos";

        let badge = criarBadgeExpiracao(expiraInicial);

        const btnMais30 = document.createElement("button");
        btnMais30.type = "button";
        btnMais30.className = "btn-small";
        btnMais30.textContent = "+30d";

        const btnIlimitado = document.createElement("button");
        btnIlimitado.type = "button";
        btnIlimitado.className = "btn-small";
        btnIlimitado.textContent = "Ilimitado";

        atalhos.append(btnMais30, btnIlimitado, badge);
        expiraWrap.append(inputData, atalhos);
        tdExpira.appendChild(expiraWrap);

        // Coluna Ações
        const tdAcoes = document.createElement("td");
        const acoesWrap = document.createElement("div");
        acoesWrap.className = "actions";

        const btnSalvar = document.createElement("button");
        btnSalvar.type = "button";
        btnSalvar.className = "btn-primary btn-small";
        btnSalvar.textContent = "Salvar";

        const btnRemover = document.createElement("button");
        btnRemover.type = "button";
        btnRemover.className = "btn-danger btn-small";
        btnRemover.textContent = "Remover";

        acoesWrap.append(btnSalvar, btnRemover);
        tdAcoes.appendChild(acoesWrap);

        const marcarAlterado = () => {
          tr.classList.add("alterado");
          const novoExpira = inputLocalParaUnix(inputData.value);
          const novoBadge = criarBadgeExpiracao(novoExpira);
          badge.replaceWith(novoBadge);
          badge = novoBadge;
        };

        inputUser.addEventListener("input", marcarAlterado);
        inputSenha.addEventListener("input", marcarAlterado);
        inputData.addEventListener("change", marcarAlterado);

        btnMais30.addEventListener("click", () => {
          const agora = Math.floor(Date.now() / 1000);
          const atual = inputLocalParaUnix(inputData.value);
          const base = atual > agora ? atual : agora;
          inputData.value = unixParaInputLocal(base + 30 * 24 * 3600);
          marcarAlterado();
        });

        btnIlimitado.addEventListener("click", () => {
          inputData.value = "";
          marcarAlterado();
        });

        btnSalvar.addEventListener("click", async () => {
          if (emOperacao) return;

          const novoUser = inputUser.value.trim();
          const novaSenha = inputSenha.value.trim();
          const novoExpira = inputLocalParaUnix(inputData.value);

          if (!novoUser || !novaSenha) {
            mostrarStatus("Usuário e senha não podem ficar vazios.", "error");
            return;
          }

          if (novoUser !== userOriginal && Object.prototype.hasOwnProperty.call(usuarios, novoUser)) {
            mostrarStatus(`O usuário "${novoUser}" já existe.`, "error");
            return;
          }

          const novoEstado = clonarUsuarios();
          if (novoUser !== userOriginal) {
            delete novoEstado[userOriginal];
          }
          novoEstado[novoUser] = { senha: novaSenha, expira: novoExpira };

          await persistirUsuarios(novoEstado, `Atualizar usuário ${novoUser}`);
        });

        btnRemover.addEventListener("click", async () => {
          if (emOperacao) return;
          if (!confirm(`Remover o usuário "${userOriginal}"?`)) return;

          const novoEstado = clonarUsuarios();
          delete novoEstado[userOriginal];
          await persistirUsuarios(novoEstado, `Remover usuário ${userOriginal}`);
        });

        tr.append(tdUser, tdSenha, tdExpira, tdAcoes);
        elBody.appendChild(tr);
      });
    }

    elFormConfig.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!emOperacao) carregarUsuarios();
    });

    elBtnSair.addEventListener("click", () => {
      sessionStorage.removeItem(STORAGE_KEY);
      elToken.value = "";
      usuarios = {};
      ultimoSha = null;
      renderizarTabela();
      mostrarStatus("Token removido da sessão.", "info");
    });

    elFormNovo.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (emOperacao) return;

      const user = document.getElementById("novoUser").value.trim();
      const senha = document.getElementById("novaSenha").value.trim();
      const horas = Number.parseInt(document.getElementById("novaValidade").value, 10);

      if (!user || !senha) {
        mostrarStatus("Usuário e senha são obrigatórios.", "error");
        return;
      }

      if (Number.isNaN(horas) || horas < 0) {
        mostrarStatus("Informe uma validade em horas igual ou maior que 0.", "error");
        return;
      }

      if (Object.prototype.hasOwnProperty.call(usuarios, user)) {
        mostrarStatus(`O usuário "${user}" já está cadastrado. Edite-o diretamente na tabela.`, "error");
        return;
      }

      const agora = Math.floor(Date.now() / 1000);
      const expira = horas > 0 ? agora + horas * 3600 : 0;

      const novoEstado = clonarUsuarios();
      novoEstado[user] = { senha, expira };

      const salvou = await persistirUsuarios(novoEstado, `Adicionar usuário ${user}`);
      if (salvou) {
        elFormNovo.reset();
        document.getElementById("novaValidade").value = "0";
      }
    });

    if (restaurarConfigSessao()) {
      carregarUsuarios();
    }
  </script>
</body>
</html>
