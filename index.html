<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel IPTV</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #d8dee4;
      --text: #1f2328;
      --muted: #59636e;
      --primary: #0969da;
      --primary-hover: #0550ae;
      --danger: #cf222e;
      --danger-hover: #a40e26;
      --success: #1a7f37;
      --warn: #9a6700;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.4;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="datetime-local"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text);
      background: #fff;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f6f8fa;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #eaeef2; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }

    .btn-small {
      padding: 5px 8px;
      font-size: 0.8rem;
    }

    .status {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #ddf4ff; border: 1px solid #54aeff; color: #0550ae; }
    .status.success { background: #dafbe1; border: 1px solid #4ac26b; color: #116329; }
    .status.error { background: #ffebe9; border: 1px solid #ff8182; color: #a40e26; }

    .table-wrapper {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f6f8fa;
      font-size: 0.85rem;
      color: var(--muted);
    }

    tr.alterado {
      background: #fff8c5;
    }

    .expira-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .expira-atalhos {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge.ativo { background: #dafbe1; color: var(--success); }
    .badge.expirado { background: #ffebe9; color: var(--danger); }
    .badge.ilimitado { background: #ddf4ff; color: var(--primary); }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Painel de Usuários IPTV</h1>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <form id="formConfig" class="card">
      <h2>Conexão com o GitHub</h2>
      <div class="grid">
        <label>
          Repositório (usuario/repo)
          <input type="text" id="cfgRepo" value="bydylo/painel" required />
        </label>
        <label>
          Arquivo JSON
          <input type="text" id="cfgArquivo" value="usuarios.json" required />
        </label>
        <label>
          Token (PAT com permissão Contents)
          <input type="password" id="cfgToken" placeholder="github_pat_..." required />
        </label>
        <div class="actions">
          <button type="submit" class="btn-primary">Conectar / Recarregar</button>
          <button type="button" id="btnSair">Limpar Token</button>
        </div>
      </div>
    </form>

    <form id="formNovo" class="card">
      <h2>Adicionar Novo Usuário</h2>
      <div class="grid">
        <label>
          Usuário
          <input type="text" id="novoUser" required autocomplete="off" />
        </label>
        <label>
          Senha
          <input type="text" id="novaSenha" required autocomplete="off" />
        </label>
        <label>
          Validade (em horas, 0 = ilimitado)
          <input type="number" id="novaValidade" value="0" min="0" step="1" required />
        </label>
        <div>
          <button type="submit" class="btn-primary">Adicionar Usuário</button>
        </div>
      </div>
    </form>

    <div class="table-wrapper">
      <table id="tabela">
        <thead>
          <tr>
            <th>Usuário</th>
            <th>Senha</th>
            <th>Expiração</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="usuariosBody">
          <tr class="empty-row">
            <td colspan="4">Informe o repositório e o token acima para carregar os usuários.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>

    let usuarios = {};
    let ultimoSha = null;
    let emOperacao = false;

    const elArquivo = document.getElementById("cfgArquivo");
    const elToken = document.getElementById("cfgToken");
